[project]
name = "sceutils"
version = "0.1.0"
description = "Utilities for PlayStation Vita SCE files"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "pycryptodomex>=3.23.0",
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project.scripts]
sceutils = "sceutils.__main__:main"
unarzl = "unarzl.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["sceutils*", "unarzl*"]
